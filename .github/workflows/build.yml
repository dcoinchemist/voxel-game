name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Prepare persistent debug signing key
        run: |
          mkdir -p signing
          if [ ! -f signing/debug.keystore.b64 ]; then
            keytool -genkeypair -keystore signing/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            base64 -w0 signing/debug.keystore > signing/debug.keystore.b64
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add signing/debug.keystore.b64
            git commit -m "Add persistent debug signing key"
            git push origin HEAD:main
          else
            base64 -d signing/debug.keystore.b64 > signing/debug.keystore
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --cleanup-tag --yes || true
          gh release create latest-debug app/build/outputs/apk/debug/app-debug.apk \
            --prerelease \
            --title "Latest debug build" \
            --notes "Automatic debug build from commit ${{ github.sha }}"
